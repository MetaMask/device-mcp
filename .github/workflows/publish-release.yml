name: Publish Release

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: true
      ANDROID_HELPER_KEYSTORE_B64:
        required: false
      ANDROID_HELPER_KEYSTORE_PASSWORD:
        required: false
      ANDROID_HELPER_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: true
          ref: ${{ github.sha }}
      - uses: MetaMask/action-publish-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn build
      - name: Set up JDK 17 for the Android helper
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK for the Android helper
        uses: android-actions/setup-android@v3
      - name: Install Android platform + build-tools
        run: |
          for attempt in 1 2 3; do
            yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' && break
            echo "sdkmanager attempt $attempt failed; retrying..." >&2
            sleep 15
          done
      - name: Decode the helper signing keystore
        env:
          ANDROID_HELPER_KEYSTORE_B64: ${{ secrets.ANDROID_HELPER_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_HELPER_KEYSTORE_B64" ]; then
            echo 'ANDROID_HELPER_KEYSTORE_B64 secret is not set; cannot build a trusted helper APK.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_HELPER_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/helper.keystore"
      - name: Build the Android snapshot helper APK
        env:
          DEVICE_MCP_HELPER_KEYSTORE: ${{ runner.temp }}/helper.keystore
          DEVICE_MCP_HELPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_HELPER_KEYSTORE_PASSWORD }}
          DEVICE_MCP_HELPER_KEY_ALIAS: ${{ secrets.ANDROID_HELPER_KEY_ALIAS }}
        run: ./scripts/build-android-helper.sh "$(node -p "require('./package.json').version")" dist/android
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: publish-release-artifacts-${{ github.sha }}
          retention-days: 4
          include-hidden-files: true
          path: |
            ./dist
            ./node_modules/.yarn-state.yml

  publish-npm-dry-run:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: true
          ref: ${{ github.sha }}
      - name: Restore build artifacts
        uses: actions/download-artifact@v6
        with:
          name: publish-release-artifacts-${{ github.sha }}
      - name: Dry Run Publish
        uses: MetaMask/action-npm-publish@v6
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          subteam: S042S7RE4AE
        env:
          SKIP_PREPACK: true

  publish-npm:
    needs: publish-npm-dry-run
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: true
          ref: ${{ github.sha }}
      - name: Restore build artifacts
        uses: actions/download-artifact@v6
        with:
          name: publish-release-artifacts-${{ github.sha }}
      - name: Publish
        uses: MetaMask/action-npm-publish@v6
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
        env:
          SKIP_PREPACK: true
