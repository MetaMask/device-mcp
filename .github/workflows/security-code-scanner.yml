name: MetaMask Security Code Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      SECURITY_SCAN_METRICS_TOKEN:
        required: false
      APPSEC_BOT_SLACK_WEBHOOK:
        required: false
  workflow_dispatch:

jobs:
  security-scan:
    uses: MetaMask/action-security-code-scanner/.github/workflows/security-scan.yml@v2
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      repo: ${{ github.repository }}
      scanner-ref: 'v2'
      paths-ignored: |
        node_modules
        **/node_modules/**
        **/__snapshots__/**
        __snapshots_linux__
        **/__stories__/**
        .storybook/
        **/*.test.ts
        **/*.test.tsx
        **/*.test.js
        **/*.test.jsx
        **/*.spec.ts
        **/*.spec.tsx
        **/*.spec.js
        **/*.spec.jsx
        **/test*/**
        **/e2e/**
        **/tests/**
      # Helper Java is built ad-hoc with javac; compile it (against the runner's
      # preinstalled android-36 SDK) so CodeQL can scan it. version/distribution
      # omitted to avoid the forbidden actions/setup-java.
      languages-config: |
        [
          {
            "language": "java-kotlin",
            "build_mode": "manual",
            "build_command": "javac --release 11 -classpath \"$ANDROID_SDK_ROOT/platforms/android-36/android.jar\" -d \"$RUNNER_TEMP/helper-classes\" $(find android/snapshot-helper/src/main/java -name '*.java')"
          }
        ]
    secrets:
      project-metrics-token: ${{ secrets.SECURITY_SCAN_METRICS_TOKEN }}
      slack-webhook: ${{ secrets.APPSEC_BOT_SLACK_WEBHOOK }}
