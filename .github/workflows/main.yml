name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-workflows:
    name: Check workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
      - name: Download actionlint
        id: download-actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/7fdc9630cc360ea1a469eed64ac6d78caeda1234/scripts/download-actionlint.bash) 1.6.23
        shell: bash
      - name: Check workflow files
        run: ${{ steps.download-actionlint.outputs.executable }} -color
        shell: bash

  analyse-code:
    name: Analyse code
    needs: check-workflows
    uses: MetaMask/action-security-code-scanner/.github/workflows/security-scan.yml@v2
    with:
      scanner-ref: v2
      paths-ignored: |
        .storybook/
        **/__snapshots__/
        **/*.snap
        **/*.stories.js
        **/*.stories.tsx
        **/*.test.browser.ts*
        **/*.test.js*
        **/*.test.ts*
        **/fixtures/
        **/jest.config.js
        **/jest.environment.js
        **/mocks/
        **/test*/
        docs/
        e2e/
        merged-packages/
        node_modules/
        storybook/
        test*/
    secrets:
      project-metrics-token: ${{ secrets.SECURITY_SCAN_METRICS_TOKEN }}
      slack-webhook: ${{ secrets.APPSEC_BOT_SLACK_WEBHOOK }}
    permissions:
      actions: read
      contents: read
      security-events: write

  build-lint-test:
    name: Build, lint, and test
    uses: ./.github/workflows/build-lint-test.yml

  # TEMPORARY (remove before merge): build the Android snapshot-helper APK on
  # every PR so we can download it as an artifact and confirm the packaging /
  # signing path works without cutting a release. Does not publish anything.
  android-helper-apk:
    name: Build Android snapshot helper APK (PR check)
    if: github.event_name == 'pull_request'
    needs: check-workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
      - run: yarn build
      # The org actions allowlist forbids android-actions/setup-android and
      # untagged actions/setup-java, and the ubuntu-latest runner already ships
      # Temurin JDK 17 plus Android platforms;android-36 and build-tools;36.0.0.
      # So we use the preinstalled toolchain directly instead of setup actions.
      - name: Ensure Android platform + build-tools (preinstalled on runner)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - name: Decode the helper signing keystore (falls back to throwaway key)
        id: keystore
        env:
          ANDROID_HELPER_KEYSTORE_B64: ${{ secrets.ANDROID_HELPER_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_HELPER_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_HELPER_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/helper.keystore"
            echo 'trusted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No ANDROID_HELPER_KEYSTORE_B64 secret; the build script will mint a throwaway key (APK will NOT match the pinned signer, which is fine for an artifact-creation check).'
            echo 'trusted=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the Android snapshot helper APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          DEVICE_MCP_HELPER_KEYSTORE: ${{ steps.keystore.outputs.trusted == 'true' && format('{0}/helper.keystore', runner.temp) || '' }}
          DEVICE_MCP_HELPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_HELPER_KEYSTORE_PASSWORD }}
          DEVICE_MCP_HELPER_KEY_ALIAS: ${{ secrets.ANDROID_HELPER_KEY_ALIAS }}
        run: ./scripts/build-android-helper.sh "$(node -p "require('./package.json').version")" dist/android
      - name: Show the built artifacts
        run: |
          echo '--- dist/android ---'
          ls -la dist/android
          echo '--- manifest ---'
          cat dist/android/*.manifest.json
      - name: Upload the Android helper APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-snapshot-helper-apk-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/android/*.apk
            dist/android/*.apk.idsig
            dist/android/*.manifest.json
            dist/android/NOTICE.md

  all-jobs-completed:
    name: All jobs completed
    runs-on: ubuntu-latest
    needs:
      - check-workflows
      - analyse-code
      - build-lint-test
    outputs:
      PASSED: ${{ steps.set-output.outputs.PASSED }}
    steps:
      - name: Set PASSED output
        id: set-output
        run: echo "PASSED=true" >> "$GITHUB_OUTPUT"

  all-jobs-pass:
    name: All jobs pass
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: all-jobs-completed
    steps:
      - name: Check that all jobs have passed
        run: |
          passed="${{ needs.all-jobs-completed.outputs.PASSED }}"
          if [[ $passed != "true" ]]; then
            exit 1
          fi

  is-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.author.name, 'github-actions')
    needs: all-jobs-pass
    outputs:
      IS_RELEASE: ${{ steps.is-release.outputs.IS_RELEASE }}
    runs-on: ubuntu-latest
    steps:
      - uses: MetaMask/action-is-release@v2
        id: is-release

  publish-release:
    needs: is-release
    if: needs.is-release.outputs.IS_RELEASE == 'true'
    name: Publish release
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ANDROID_HELPER_KEYSTORE_B64: ${{ secrets.ANDROID_HELPER_KEYSTORE_B64 }}
      ANDROID_HELPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_HELPER_KEYSTORE_PASSWORD }}
      ANDROID_HELPER_KEY_ALIAS: ${{ secrets.ANDROID_HELPER_KEY_ALIAS }}
